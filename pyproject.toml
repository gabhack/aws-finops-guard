[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-finops-guard"
version = "0.1.0"
description = "Open-Core AWS Cloud & LLM/Bedrock FinOps Guardrails CLI + MCP Server (stdio) with Terraform Auto-Remediation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gabriel N. (TuringTec)" }]
keywords = ["aws", "finops", "mcp", "model-context-protocol", "bedrock", "terraform", "cost-optimization", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aws-finops-guard = "aws_finops_guard.cli:main"

[project.urls]
Homepage = "https://gabhack.github.io/turingtec-agent-studio/"
Repository = "https://github.com/gabhack/aws-finops-guard"
"Pro License" = "https://gabbler407.gumroad.com/"
